<!DOCTYPE html>
<html lang="ko" class="booting">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>종합 자산 관리</title>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* 화면 조각을 받는 동안만 어두운 바탕 — 흰 화면 깜빡임 방지. 첫 화면이 그려지는 순간 main.tsx(BootDone)가 booting을 지운다.
         ⚠️ body:has(#root:empty)로 쓰지 말 것 — 화면 요소가 바뀔 때마다 문서 전체 스타일을 다시 재서 계좌 전환이 약 0.5초 느려졌다.
         ⚠️ #root:empty에 덮개를 두지 말 것 — 백테스트 창은 body 포털로 그려 #root가 계속 비어 덮개가 남는다(2026-11-15 실측). */
      html.booting, html.booting body { background: #0b1120; }
    </style>
    <!-- Google Identity Services (OAuth2 for Drive API) -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
