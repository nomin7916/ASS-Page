  <path d="M240 214 L 300 214" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#ah)"/>
  <text x="270" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">Gemini</text>
  <rect x="310" y="70" width="380" height="290" rx="14" fill="#111827" stroke="#334155"/>
  <text x="330" y="98" font-size="14" font-weight="700" fill="#e2e8f0">맞춘 결과 — 바꿈 2 · 0으로 1 · 새로 추가 1</text>
  <text x="330" y="132" font-size="12.5" fill="#cbd5e1">종목 A</text><text x="500" y="132" font-size="12" fill="#94a3b8">7 → 9주</text><text x="670" y="132" text-anchor="end" font-size="12" font-weight="700" fill="#7dd3fc">바꿈</text>
  <text x="330" y="162" font-size="12.5" fill="#cbd5e1">종목 B</text><text x="500" y="162" font-size="12" fill="#94a3b8">같음</text><text x="670" y="162" text-anchor="end" font-size="12" fill="#6b7280">같음</text>
  <text x="330" y="192" font-size="12.5" fill="#cbd5e1">종목 C</text><text x="500" y="192" font-size="12" fill="#94a3b8">300 → 348주</text><text x="670" y="192" text-anchor="end" font-size="12" font-weight="700" fill="#7dd3fc">바꿈</text>
